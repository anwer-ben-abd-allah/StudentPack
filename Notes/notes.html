</nav>
<div class="app">
  <aside class="sidebar">

    <div class="sidebar-header">
      <h1>My Notes</h1>
      <button class="btn-new" id="btn-new">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="5"  x2="12" y2="19"/>
          <line x1="5"  y1="12" x2="19" y2="12"/>
        </svg>
        New note
      </button>
    </div>

    <div class="sidebar-search">
      <input type="search" id="search" placeholder="Search notes…" autocomplete="off">
    </div>

    <div class="notes-list" id="notes-list">
    </div>

  </aside>

  
  <main class="editor-pane">
    <div class="editor-welcome" id="welcome">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9"  y1="15" x2="15" y2="15"/>
      </svg>
      <p>Select a note or create a new one.</p>
      <small>All notes are saved to the database.</small>
      <button class="btn-new" id="btn-new-welcome" style="margin-top:10px; width:auto; padding:8px 20px;">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="5"  x2="12" y2="19"/>
          <line x1="5"  y1="12" x2="19" y2="12"/>
        </svg>
        Create a note
      </button>
    </div>
    <div id="editor" style="display:none; flex-direction:column; flex:1; overflow:hidden;">

      <!-- Toolbar -->
      <div class="editor-toolbar">

        <!-- Subject dropdown — options injected by notes.js from SUBJECTS constant -->
        <select id="e-subject" aria-label="Subject">
          <option value="">— Subject —</option>
        </select>

        <input type="date" id="e-date" aria-label="Date">

        <div class="toolbar-gap"></div>

        <button class="btn-delete" id="btn-delete" title="Delete note" aria-label="Delete note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
        </button>

        <button class="btn-save" id="btn-save" aria-label="Save note">
          Save &nbsp;<kbd style="font-size:10px; opacity:0.55">⌘S</kbd>
        </button>

      </div>
      <input
        type="text"
        id="e-title"
        class="editor-title"
        placeholder="Note title…"
        aria-label="Note title"
        autocomplete="off"
      >

      <!-- Body textarea -->
      <textarea
        id="e-body"
        class="editor-body"
        placeholder="Start writing…"
        aria-label="Note body"
        spellcheck="true"
      ></textarea>
      <div class="editor-status">
        <span id="word-count">0 words</span>
        <span id="save-status" class="status-saved">Saved ✓</span>
      </div>

    </div>

  </main>

</div>


<script src="../navbar_auth.js"></script>
<script src="notes.js"></script>

</body>
</html>
